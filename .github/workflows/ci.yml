name: CI

# Runs in the server repo (esdtellar-lms-backend), where server/ is the root.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # matches the production box
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # The API e2e suite (server/test) against a throwaway Postgres. It must pass,
  # and every route must have a successful e2e test (route coverage, --strict),
  # before production is touched. Owner's rule, 2026-11-20.
  e2e:
    name: API e2e · route coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: edstellar_lms_e2e
        ports: ['5436:5432']
        options: >-
          --health-cmd "pg_isready -U e2e" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://e2e:e2e@127.0.0.1:5436/edstellar_lms_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: API e2e suite + strict route coverage
        run: npm run test:e2e:ci
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-route-coverage
          path: test/.coverage/report.json

  deploy:
    name: deploy (ssh)
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # SSH into the box and run its deploy.sh (git pull + npm install + build +
      # pm2 restart + health check). Secrets: DEPLOY_HOST, DEPLOY_USER,
      # DEPLOY_SSH_KEY (the CI deploy key's PRIVATE half).
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd /var/www/frontend/edstellar_lms_api
            before=$(git rev-parse --short HEAD)
            # Post the result to Cliq either way (BACKEND_STRUCTURE 10.50), then
            # fail the job if the deploy failed. `if` so script_stop does not
            # skip the failure notice.
            if sudo ./deploy.sh; then
              after=$(git rev-parse --short HEAD)
              echo "deployed: $before -> $after"
              sudo node /var/www/frontend/edstellar_lms_api/scripts/cliq-notify.mjs info "API deployed" "Backend $before -> $after. Remember: deploy.sh does not restart the worker." || true
            else
              sudo node /var/www/frontend/edstellar_lms_api/scripts/cliq-notify.mjs critical "API deploy FAILED" "Backend deploy from $before failed. See the GitHub Actions run; incident response plan runbook R10." || true
              exit 1
            fi
